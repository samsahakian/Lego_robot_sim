<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Practice Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🤖 Robot Practice</h1>
    <label>Challenge:
      <select id="level"></select>
    </label>
  </header>

  <main>
    <section id="editor">
      <div id="blocklyDiv"></div>
    </section>

    <section id="sim">
      <canvas id="mat"></canvas>
      <div id="controls">
        <button id="run" class="primary">▶ Run</button>
        <button id="stop" class="danger">■ Stop</button>
        <button id="reset">↺ Reset robot</button>
        <button id="clear">🗑 Clear blocks</button>
      </div>
      <p id="hint"></p>
      <p id="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/msg/en.js"></script>
  <script src="app.js"></script>
</body>
</html>
